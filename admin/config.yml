backend:
  name: github
  repo: fabbery/fabbery.github.io
  branch: main
  auth_methods:
    - token
  commit_messages:
    update: "Update {{collection}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://fabbery.world
display_url: https://fabbery.world

media_folder: photos
public_folder: /photos
media_libraries:
  default:
    config:
      max_file_size: 26214400
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: ascii

collections:
  - name: gallery
    label: Model gallery
    description: Create, rename and reorder gallery collections, then add model photos, descriptions and Added on dates inside them. The three freshest models appear in Latest designs
    files:
      - name: catalog
        label: Collections
        file: content/catalog.json
        format: json
        fields:
          - name: collections
            label: Collections
            label_singular: collection
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Collection name, widget: string }
              - name: models
                label: Models in this collection
                label_singular: model
                widget: list
                required: false
                add_to_top: true
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Model name, widget: string }
                  - { name: text, label: Description, widget: text, required: false }
                  - { name: photo, label: Photo, widget: image, required: false, choose_url: false, accept: "image/*" }
                  - { name: released, label: Added on, widget: datetime, format: YYYY-MM-DD, time_format: false, default: "{{now}}", required: true }
  - name: settings
    label: Site links
    description: Manage the links used by the Patreon, Pinterest and Instagram buttons
    files:
      - name: site
        label: Patreon, Pinterest and Instagram
        file: content/site.json
        format: json
        fields:
          - { name: patreon, label: Patreon URL, widget: string, type: url, required: false }
          - { name: pinterest, label: Pinterest URL, widget: string, type: url, required: false }
          - { name: instagram, label: Instagram URL, widget: string, type: url, required: false }
