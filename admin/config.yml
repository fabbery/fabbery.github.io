backend:
  name: github
  repo: fabbery/fabbery.github.io
  branch: main
  auth_methods:
    - token
  commit_messages:
    update: "Update {{collection}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://fabbery.github.io
display_url: https://fabbery.github.io

media_folder: photos
public_folder: /photos
media_libraries:
  default:
    config:
      max_file_size: 26214400
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: ascii

collections:
  - name: models
    label: Model gallery
    description: Add a model photo, its title, description and Added on date. The three models with the freshest dates appear in Latest designs
    files:
      - name: models
        label: Models
        file: content/catalog.json
        format: json
        fields:
          - name: models
            label: Models
            label_singular: model
            widget: list
            required: false
            add_to_top: true
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Model name, widget: string }
              - { name: text, label: Description, widget: text, required: false }
              - { name: photo, label: Photo, widget: image, required: false, choose_url: false, accept: "image/*" }
              - { name: released, label: Added on, widget: datetime, format: YYYY-MM-DD, time_format: false, default: "{{now}}", required: true }
  - name: settings
    label: Site links
    description: Manage the links used by the Patreon, Pinterest and Instagram buttons
    files:
      - name: site
        label: Patreon, Pinterest and Instagram
        file: content/site.json
        format: json
        fields:
          - { name: patreon, label: Patreon URL, widget: string, type: url, required: false }
          - { name: pinterest, label: Pinterest URL, widget: string, type: url, required: false }
          - { name: instagram, label: Instagram URL, widget: string, type: url, required: false }
